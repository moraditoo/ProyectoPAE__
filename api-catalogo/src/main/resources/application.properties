spring.application.name=api-catalogo
server.port=8080

# Base de datos H2 en memoria: los datos son simulados y se reinician al apagar la API
spring.datasource.url=jdbc:h2:mem:catalogodb
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate: crea la tabla automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Consola web de H2 (opcional): http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Mensajes de error legibles en las respuestas JSON
server.error.include-message=always